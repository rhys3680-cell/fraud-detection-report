[project]
name = "frauddetectionreport"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rhys", email = "rhys3680@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "tqdm>=4.70.0",
]

[project.scripts]
frauddetectionreport = "frauddetectionreport:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
